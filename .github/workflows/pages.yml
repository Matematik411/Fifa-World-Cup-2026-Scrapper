name: Deploy reports to GitHub Pages

# Publishes the rendered HTML in output/ to GitHub Pages on every push that
# changes it. Requires (one-time): Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions" (and the repo must be public, or Pages-enabled on a paid plan).
on:
  push:
    branches: [main]
    paths:
      - "output/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload reports (output/) as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
