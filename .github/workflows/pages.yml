name: Deploy reports to GitHub Pages

# Publishes the rendered HTML in output/ to GitHub Pages on every push that
# changes it. Requires (one-time): Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions" (and the repo must be public, or Pages-enabled on a paid plan).
#
# Action pins = the LAST-GREEN set (reverted 2026-07-03). The 2026-07-02 bump to
# the Node-24 majors (checkout@v5 / configure-pages@v6 / upload-pages-artifact@v5 /
# deploy-pages@v5) broke every deploy after it (3/3 runs + all manual re-runs):
#   - deploy-pages@v5 hard-errors on re-runs ("Multiple artifacts named
#     'github-pages' were unexpectedly found", api-client.js:89) where v4
#     tolerated them (our last green deploy WAS a manual re-run),
#   - and its fresh attempts died too ("Deployment failed, try again later." /
#     10-min "Timeout reached, aborting!").
#   v5.0.0 has had no patch release since 2026-03; upstream even ships
#   v3.0.2-node.24 for people who need old behavior on new Node. Until a fixed
#   v5.x lands, we accept the cosmetic Node-20 deprecation warning: deploys
#   beat warnings. Do NOT re-bump without testing on a throwaway push.
on:
  push:
    branches: [main]
    paths:
      - "output/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload reports (output/) as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      # The Pages build worker intermittently wedges ("Timeout reached,
      # aborting!") — even our last green run needed a second attempt. One
      # automatic in-job retry against the already-uploaded artifact saves the
      # manual re-run click.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deploy (first attempt wedged)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
