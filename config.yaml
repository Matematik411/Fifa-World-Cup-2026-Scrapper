# ---------------------------------------------------------------------------
# Configuration for the FIFA World Cup 2026 forecast + optimizers.
# Edit values here; the pipeline reads this on every run.
# ---------------------------------------------------------------------------

tournament:
  name: "FIFA World Cup 2026"
  start_date: "2026-06-11"
  end_date: "2026-07-19"
  user_timezone: "Europe/Ljubljana"   # Slovenia (CET/CEST) — deadlines shown in this + match-local
  n_groups: 12
  teams_per_group: 4
  group_matches: 72
  total_matches: 104

# --- Fantasy game rules (defaults; overridden by data/manual/fantasy_rules.json when present) ---
fantasy:
  budget: 100.0           # $M, group stage
  ko_budget_bonus: 5.0    # +$5M for the Knockout Phase
  squad:
    GK: 2
    DEF: 5
    MID: 5
    FWD: 3
  nation_cap: 3           # max players from one national team (verified live; FIFA WC fantasy historically allows more — overridden by research)
  formations:             # valid (DEF, MID, FWD) starting-XI shapes (1 GK always)
    - [3, 4, 3]
    - [3, 5, 2]
    - [4, 3, 3]
    - [4, 4, 2]
    - [4, 5, 1]
    - [5, 3, 2]
    - [5, 4, 1]
    - [5, 2, 3]
  free_transfers_per_round: 2   # default; the verified per-round map in fantasy_rules.json overrides
  extra_transfer_penalty: -3    # verified: -3 per extra transfer (fantasy_rules.json overrides anyway)
  rotation_rest_factor: 0.6     # U3: a clinched team's nailed starters drop to this × start prob in the dead rubber
  wc_form_shrink_minutes: 600   # U5: shrinkage constant K — club-season per-90 gets weight K/(K+wc_minutes)
  burner_margin: 2.0            # U4: pick the R32 burner over the durable squad ONLY if it beats it on R32 EV
                                #     (points + QB) by ≥ this — else the durable squad's extra horizon is free
                                #     option value. Revised 2026-06-28: the Wildcard is NOT auto-committed to R16
                                #     (a favourites-heavy R32 squad survives the R32, so R16's free transfers cover
                                #     it; the WC is held for the deeper QF/SF break), so horizon matters → durable
                                #     wins ties. The chip scheduler places the WC by squad-breakage, not a fixed round.
  # Mystery Booster — REVEALED at R32 (2026-06-28) as the "Clean Sheet Shield" (FFScout).
  mystery_booster:
    known: true
    name: "Clean Sheet Shield"
    clean_sheet: true           # defensive-stack chip → scheduled at a deep round, not the R32 (QB) slot
    best_round: "SF"            # provisional; the QF/SF/Final order is re-optimized as the bracket sets
    effect: "GK/DEF/MID keep their clean-sheet bonus until the team concedes a SECOND goal (one-goal buffer); the 60-minute rule still applies. Usable R32→Final, once."

# --- Nostradamus scoring (defaults; overridden by data/manual/nostradamus.json) ---
nostradamus:
  exact: 3
  outcome_plus_one: 2
  outcome_only: 1
  wrong: 0
  ko_multiplier: 2          # doubling from Round of 32 through the final
  ko_doubling_starts: "R32"
  resolution: "90min"       # 90-minute regular-time result only

# --- GoPicks scoring (Sentora partners league on gopicks.app; overridden by data/manual/gopicks.json) ---
gopicks:
  result: 3                 # correct result (home win / draw / away win)
  exact_home: 1             # exact home goals (independent of the result)
  exact_away: 1             # exact away goals (independent of the result)
  resolution: "90min"       # regular time only, no ET/pens — same as Nostradamus
  tiebreaker: "total_exact_goal_picks"

# --- Model parameters ---
model:
  goal_cap: 8                  # scoreline matrix goals 0..goal_cap
  sim_iterations: 200000       # Monte-Carlo bracket iterations
  rng_seed: 20260605
  dixon_coles_rho: -0.12       # low-score correlation correction (calibrated/typical)
  # Ensemble weights for deriving team attack/defence strength (renormalized over available signals)
  ensemble_weights:
    market_title: 0.30         # de-vigged outright title odds
    market_match: 0.30         # de-vigged per-match 1X2 (when available, dominates that match)
    elo: 0.25
    model_probs: 0.15          # public supercomputer/model forecasts
  # Match-context adjustments (multiplicative on lambda or additive on rating)
  home_advantage_goals: 0.35   # host nations (USA/MEX/CAN) attacking bump in their matches
  altitude_venues:             # extra goals/variance at altitude (Mexico City, Guadalajara)
    - "Mexico City"
    - "Guadalajara"
  altitude_factor: 1.05
  base_total_goals: 2.65       # league-neutral expected total when no market total available
  dead_rubber_intensity: 0.92  # U3: goal multiplier when BOTH teams are settled in a last group game (light)
  # U2 team form (opponent-adjusted WC xG → small post-calibration strength offset). weight=0 disables.
  team_form_weight: 0.15       # max strength shift in z-units (small — market already prices priced matches)
  team_form_shrink_matches: 3  # shrink K: weight m/(m+K), so 2 games ≈ 0.4 of full effect
  team_form_opp_coef: 0.5      # credit for the strength of opponents faced (schedule adjustment)
  team_form_scale: 1.5         # xG-difference/game that maps to a full-unit (pre-weight) nudge

sources:
  # Toggle individual fetchers. Manual (Claude-curated) inputs are always read.
  fifa_fantasy_feed: true
  elo_scrape: true
  football_data: false   # needs API key
  api_football: false    # needs API key

report:
  title: "World Cup 2026 — Predictions & Fantasy Guide"
  author_note: "Built and maintained by Claude. One recommended call per decision — follow it."
