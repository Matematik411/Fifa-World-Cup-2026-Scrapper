[project]
name = "fifa-wc-2026"
version = "0.1.0"
description = "FIFA World Cup 2026 — shared forecast model feeding a Nostradamus score-predictor optimizer and a FIFA Fantasy ILP optimizer, with self-contained HTML reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "selectolax>=0.3.21",
    "lxml>=5.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pulp>=2.8",
    "highspy>=1.7",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
wc2026 = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
